<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f3ea">
  <meta name="description" content="Explore ton encyclopédie Disney Dreamlight Valley.">
  <title>Explorer les catégories — Dreamlight Companion</title>
  <link rel="stylesheet" href="style.css?v=20261127-4">
</head>
<body>

  <header class="hero">
    <div class="hero-shade"></div>
    <div class="hero-content">
      <p class="eyebrow">TON PETIT GUIDE DE LA VALLÉE</p>
      <h1>Dreamlight <span>Companion</span></h1>
      <p class="hero-subtitle">Explore tous les secrets de ta vallée ✨</p>
    </div>
  </header>

  <main class="page-shell">

    <section class="catalog-section">
      <button class="text-button" id="back-home" type="button">
        ← Retour à l'accueil
      </button>

      <label class="search-box">
        <span>⌕</span>
        <input id="global-search" type="search"
          placeholder="Rechercher dans toute la vallée…"
          autocomplete="off">
      </label>
    </section>

    <section class="catalog-section">
      <div class="section-heading catalog-heading">
        <div>
          <p class="eyebrow">TOUT POUR EXPLORER</p>
          <h2>Mon encyclopédie</h2>
        </div>
      </div>

      <div id="category-grid" class="category-grid"></div>
    </section>

    <section id="catalog-view"
      class="panel catalog-view hidden"
      aria-live="polite">

      <div class="section-heading">
        <div>
          <p class="eyebrow">MON ENCYCLOPÉDIE</p>
          <h2 id="catalog-title">Catalogue</h2>
        </div>
        

      <p id="catalog-description" class="muted"></p>
      <div id="catalog-items" class="catalog-items"></div>
    </section>

  </main>

  <footer>
    <span>Dreamlight Companion</span>
    <span>Créé avec douceur pour ta vallée ✨</span>
  </footer>

  <script src="app.js?v=20261127-5" defer></script>
</body>
</html>
